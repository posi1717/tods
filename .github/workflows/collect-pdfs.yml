name: UKKB PDF Collector

on:
  push:
    branches: [main]
    paths:
      - 'config.yaml'
      - 'uk_kb_collector/**'
      - '.github/workflows/collect-pdfs.yml'
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout UKKB
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect official PDFs into Knowledge_Base
        id: collect
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          python -m uk_kb_collector.main --production
          status=$?
          echo "collector_exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "Collector exit code: $status"
          # The collector records per-URL failures in its report and can still
          # produce valid partial results. Do not discard those results.
          exit 0

      - name: Show collection result
        run: |
          echo "--- Collector exit code ---"
          echo "${{ steps.collect.outputs.collector_exit_code }}"
          echo '--- Knowledge_Base PDF count ---'
          find Knowledge_Base -type f -iname '*.pdf' | wc -l || true
          echo '--- Recent files ---'
          find Knowledge_Base -type f | sort | tail -50 || true
          echo '--- Latest logs ---'
          find Knowledge_Base/09_Logs -type f | sort | tail -5 || true

      - name: Commit downloaded PDFs and registry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Knowledge_Base
          if git diff --cached --quiet; then
            echo 'No new or changed Knowledge_Base files.'
          else
            git commit -m "kb: collect official procurement PDFs"
            git push
          fi
