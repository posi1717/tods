name: UKKB PDF Collector

on:
  push:
    branches: [main]
    paths:
      - 'config.yaml'
      - 'uk_kb_collector/**'
      - '.github/workflows/collect-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout UKKB
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect official PDFs into Knowledge_Base
        run: python -m uk_kb_collector.main --production

      - name: Show collection result
        run: |
          echo '--- Knowledge_Base PDF count ---'
          find Knowledge_Base -type f -iname '*.pdf' | wc -l || true
          echo '--- Recent files ---'
          find Knowledge_Base -type f | sort | tail -50 || true

      - name: Commit downloaded PDFs and registry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Knowledge_Base
          if git diff --cached --quiet; then
            echo 'No new or changed Knowledge_Base files.'
          else
            git commit -m "kb: collect official procurement PDFs"
            git push
          fi
