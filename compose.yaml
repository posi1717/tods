services:
  tods-gateway:
    build:
      context: .
    image: tods-gateway:baseline
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/status', timeout=3)); assert data['status'] == 'online'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
