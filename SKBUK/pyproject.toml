[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skbuk"
version = "0.1.0"
description = "Source Knowledge Base UK for Tender Official Document evidence"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "tenacity>=8.2,<10",
  "pypdf>=6,<7",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-httpx>=0.30,<1"]

[project.scripts]
skbuk = "skbuk.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
